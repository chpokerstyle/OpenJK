// ===================================================================
//  Магические Жезлы - MOBA мод, конфиг клиента и сервера.
//  Копируется в <GameData>/base/moba.cfg и запускается так:
//    openjk.x86_64.exe +set fs_homepath ... +exec moba.cfg +map mp/ffa2
//  Клиентские команды (bind) читает только клиент, серверные (g_*, moba_*)
//  выполняются на сервере - в одном файле они просто применяются к обеим
//  сторонам, лишние на другой стороне игнорируются.
// ===================================================================

// --- включение мода ---
set g_moba 1                 // 1 = мод активен (0 = обычная игра)
set moba_log 1               // подробный лог в games.log (для отладки)

// --- режим ---
set g_gametype 6             // командная игра (мод всё равно принудительно ставит 6)
set sv_maxclients 8
set sv_pure 0

// --- фазы раунда, секунды ---
set moba_pickTime 30         // выбор героя
set moba_buyTime 20          // закупка
set moba_roundEndTime 8      // пауза между раундами

// --- экономика ---
set moba_startGold 1000      // стартовые монеты

// --- боты, чтобы можно было играть в одиночку ---
set moba_bots 3              // сколько ботов добавить, 0 = не добавлять

// --- отключить принудительный респавн ---
set g_forceRespawn 0
set g_siegeRespawn 0

// --- MOBA shop panel (cgame) ---
// The JKA client never passes raw key codes to the cgame, so these binds write
// a token into cg_mobaKey and the panel reacts to it: B opens or closes the
// shop, the six keys below buy that slot and close it again.
//
// The keys are the free ones of the default JKA layout on purpose: the digits
// and the numpad stay on weapons, movement and force powers. Binds go by key
// code, so on a non-US layout it is the physical position that counts.
// The semicolon has to be written as SEMICOLON, a bare ";" is the command
// separator of the client command buffer and would split the line.
//
// The client writes its binds back to openjk.cfg on exit, so a session that
// rebinds these keys by hand keeps the new values over this file.
bind b "set cg_mobaKey b"
bind g "set cg_mobaKey 1"
bind h "set cg_mobaKey 2"
bind j "set cg_mobaKey 3"
bind n "set cg_mobaKey 4"
bind x "set cg_mobaKey 5"
bind SEMICOLON "set cg_mobaKey 6"
seta cg_mobaKey 0
