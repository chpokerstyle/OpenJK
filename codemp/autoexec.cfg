// ===================================================================
//  MOBA (Magic Wands) -  правила сервера.
//
//  Ётот файл читают и клиент, и выделенный сервер при старте
//  (openjk.cfg -> mpdefault.cfg -> autoexec.cfg).  лиент переписывает
//  openjk.cfg при выходе и сохран€ет только CVAR_ARCHIVE переменные,
//  поэтому g_moba и moba_* там не удерживаютс€: единственное место,
//  где они переживают перезапуск, - этот файл.
//
//  Ќужен потому, что ServerLauncher.exe запускает openjkded без
//  "+exec moba.cfg": сервер поднималс€ с g_moba = 0, MOBA была
//  выключена, и клиент не получал ни магазина (B), ни окна пика.
//
//  “е же значени€ продублированы в moba.cfg - он остаЄтс€ дл€ ручного
//  запуска "+exec moba.cfg". «начени€ из командной строки перекрывают
//  и этот файл, и moba.cfg.
// ===================================================================

// --- главный переключатель и режим ---
set g_moba 1                 // 1 = MOBA включена (0 = обычна€ игра)
set moba_mode 1              // 1 = all pick, 0 = captain draft
set g_gametype 6             // FFA-сущности, мод превращает игру в командную
set moba_log 1               // подробный лог моды в games.log

// --- сеть ---
set sv_maxclients 8
set sv_pure 0

// --- фазы матча ---
set moba_pickTime 30         // окно пика геро€
set moba_buyTime 14          // окно магазина
set moba_roundTime 180       // длительность раунда
set moba_roundEndTime 8      // пауза между раундами

// --- золото ---
set moba_startGold 1000      // стартовое золото

// --- боты ---
  set moba_lobbyTime 45
  set moba_bots 3              // 3 бота на обеих командах, 0 = без ботов
// --- пик ---
set moba_autodraft 0         // 0 = пик об€зателен (!pick N или клик по доске)

// --- респаун и модели ---
set g_forceRespawn 0
set g_siegeRespawn 0
set d_perPlayerGhoul2 1